<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable ^ itinerance.ch</title>
<script>
  // Redirige les anciennes adresses PHP (liens Google, favoris) vers le nouveau site.
  (function () {
    var path = location.pathname;
    // site de projet (utilisateur.github.io/depot/) : on garde le préfixe du dépôt
    var base = "/";
    if (location.hostname.endsWith("github.io")) {
      var seg = path.split("/")[1];
      if (seg) base = "/" + seg + "/";
    }
    var rest = path.slice(base.length).replace(/^\/+/, "");
    var target = null, m;
    if (rest === "" || rest === "index.php") target = "index.html";
    else if (rest === "pages/blog.php") target = "blog.html";
    else if ((m = rest.match(/^pages\/posts\/.*-(\d+)\.php$/))) target = "post.html?id=" + m[1];
    else if ((m = rest.match(/^pages\/(.+)\.php$/))) target = "page.html?p=" + m[1].replace(/\//g, "-").toLowerCase();
    if (target) location.replace(base + target);
    window.SITE_BASE = base;
  })();
</script>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f4ef; color: #1d2830;
         font: 18px/1.6 "Segoe UI", system-ui, sans-serif; text-align: center; padding: 20px; }
  h1 { font-family: Georgia, serif; font-weight: 500; font-size: 40px; margin: 0 0 8px; }
  a { color: #2c6e8a; }
</style>
</head>
<body>
  <div>
    <h1>Page introuvable</h1>
    <p>Ce chemin ne mène nulle part… <a id="home" href="/">Retour à l'accueil</a></p>
    <script>document.getElementById("home").href = window.SITE_BASE;</script>
  </div>
</body>
</html>
